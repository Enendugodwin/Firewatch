[project]
name = "firewatch-x-backend"
version = "0.1.0"
description = "FIREWATCH X — global fire intelligence API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "celery>=5.4",
    "duckdb>=1.1",
    "polars>=1.9",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pytz>=2024.2",
    "pytz>=2024.2",
    "pydantic-settings>=2.6",
    "redis>=5.1",
    "sqlalchemy>=2.0.35",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
